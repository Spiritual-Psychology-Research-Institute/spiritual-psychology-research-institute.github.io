# 고모 -> 메일 -> 이슈.
# 15분마다 전용 메일함을 확인해 허용된 발신자의 메일만 `site-request` 이슈로 만듭니다.
name: 메일 수신함 확인

on:
  schedule:
    # 정각을 피한다. GitHub 예약 실행은 매시 정각 부근에 부하가 몰려
    # 지연되거나 건너뛴다. */15 는 :00 을 정확히 때리므로 가장 불리하다.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  # 예약이 지연될 때를 대비한 수동/외부 트리거.
  repository_dispatch:
    types: [check-mail]

concurrency:
  group: mail-inbox
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      # 시크릿을 넣기 전에도 15분마다 실패 메일이 날아오지 않도록,
      # 설정이 끝나지 않았으면 조용히 건너뜁니다.
      - name: 설정 여부 확인
        id: guard
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ALLOWED_SENDERS: ${{ secrets.ALLOWED_SENDERS }}
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          if [ -z "$MAIL_USER" ] || [ -z "$MAIL_PASSWORD" ] \
             || [ -z "$ALLOWED_SENDERS" ] || [ -z "$AUTOMATION_TOKEN" ]; then
            echo "::notice::시크릿이 아직 설정되지 않아 건너뜁니다. docs/AUTOMATION.md 참고."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@v4

      - if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성 설치
        if: steps.guard.outputs.ready == 'true'
        working-directory: .github/scripts
        run: npm install --no-audit --no-fund

      - name: 새 메일을 이슈로 변환
        if: steps.guard.outputs.ready == 'true'
        working-directory: .github/scripts
        env:
          MAIL_HOST: ${{ vars.MAIL_HOST || 'imap.gmail.com' }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ALLOWED_SENDERS: ${{ secrets.ALLOWED_SENDERS }}
          # GITHUB_TOKEN 으로 만든 이슈는 다른 워크플로를 트리거하지 않습니다.
          # 따라서 반드시 PAT 이어야 합니다.
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node fetch-mail.mjs

      # 하트비트가 죽으면 되살릴 수단이 고장난 cron 뿐이라 자동화 전체가
      # 멈춘다. 메일 확인이 돌 때마다 하트비트 생존을 확인하고 없으면 띄운다.
      # 읽기는 GITHUB_TOKEN 으로, 깨우기는 PAT 으로 한다
      # (GITHUB_TOKEN 은 다른 워크플로를 트리거하지 못한다).
      - name: 하트비트 생존 확인
        if: steps.guard.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PAT: ${{ secrets.AUTOMATION_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          n=$(gh api "repos/$REPO/actions/workflows/mail-keepalive.yml/runs?status=in_progress" \
                --jq '.total_count' 2>/dev/null || echo "-1")
          if [ "$n" = "-1" ]; then
            echo "::notice::하트비트 상태를 확인하지 못했습니다 (권한 부족일 수 있음). 건너뜁니다."
          elif [ "$n" = "0" ]; then
            echo "::warning::하트비트가 멈춰 있습니다. 다시 띄웁니다."
            curl -s -o /dev/null -X POST \
              -H "Authorization: Bearer $PAT" \
              -H "Accept: application/vnd.github+json" \
              -d '{"event_type":"keepalive"}' \
              "https://api.github.com/repos/$REPO/dispatches"
          else
            echo "하트비트 정상 (실행 중 ${n}건)"
          fi

      # 무인 운영에서는 침묵이 정상과 구분되지 않는다. 실패를 메일로 알린다.
      - name: 실패 시 관리자에게 알림
        if: failure()
        working-directory: .github/scripts
        env:
          MAIL_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ALERT_TO: ${{ vars.NOTIFY_CC || 'kakwak123@gmail.com' }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e "process.exit(0)" 2>/dev/null || exit 0
          npm install --no-audit --no-fund >/dev/null 2>&1 || true
          node send-alert.mjs || true
