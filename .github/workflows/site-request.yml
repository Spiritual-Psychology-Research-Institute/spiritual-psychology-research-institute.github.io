# 이슈 -> Claude -> PR -> (검사 통과 시) 자동 머지 -> 메일 회신.
#
# 사람 승인을 뺀 대신 CI 검사가 관문이다. 검사가 실패하면 PR 은 열린 채로
# 남고 자동 머지되지 않는다. 프롬프트에 적은 파일 제한은 지시일 뿐이므로
# validate-site.mjs 에서 실제로 강제한다.
name: 수정 요청 처리

on:
  issues:
    types: [labeled]

# 한 번에 하나씩만. 두 요청이 동시에 돌면 각자 main 에 머지하려다
# 충돌하거나, 뒤늦게 머지된 쪽이 앞의 변경을 모른 채 덮어쓴다.
concurrency:
  group: site-request
  cancel-in-progress: false

jobs:
  edit:
    if: github.event.label.name == 'site-request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 검사기는 main 의 것을 쓴다. PR 을 체크아웃한 뒤 거기 있는 검사기를
      # 돌리면, 검사기 자체를 고친 PR 이 자기 검사를 통과시킬 수 있다.
      - name: 검사기 따로 두기
        run: cp -r .github/scripts "$RUNNER_TEMP/tools"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 싼 모델이 먼저 하고, 안 되면 좋은 모델이 이어받는다.
      #
      # 요청 대부분은 문구 한 줄이라 Haiku 로 충분하다. Haiku 의 결과가
      # 검사를 통과한 PR 일 때만 그대로 쓰고, 그 밖의 경우(PR 없음, 검사
      # 실패, 되묻기, 이미 반영됨, 모양 요청, 중간에 멈춤)에는 Sonnet 이
      # 처음부터 다시 본다. 사진은 레이아웃 판단과 사진을 보는 눈이 필요해
      # 처음부터 Sonnet 이다. 본문으로 판단한다 - labeled 이벤트 시점에
      # photo 라벨이 아직 안 붙어 있을 수 있다.
      - name: 모델 고르기
        id: model
        env:
          GH_TOKEN: ${{ github.token }}
          FAST_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-4-5' }}
          STRONG_MODEL: ${{ vars.CLAUDE_STRONG_MODEL || 'claude-sonnet-5' }}
        run: |
          body=$(gh issue view "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --json body --jq .body)
          if grep -q '^## 사진' <<<"$body" || [ "$FAST_MODEL" = "$STRONG_MODEL" ]; then
            echo "first=$STRONG_MODEL" >> "$GITHUB_OUTPUT"
            echo "fast=false" >> "$GITHUB_OUTPUT"
          else
            echo "first=$FAST_MODEL" >> "$GITHUB_OUTPUT"
            echo "fast=true" >> "$GITHUB_OUTPUT"
          fi
          echo "strong=$STRONG_MODEL" >> "$GITHUB_OUTPUT"

      - name: 프롬프트 만들기
        id: prompt
        env:
          ISSUE: ${{ github.event.issue.number }}
          FAST: ${{ steps.model.outputs.fast }}
        run: |
          render() { sed "s/{{ISSUE}}/$ISSUE/g" "$@"; }
          d="EOF_$(date +%s%N)"
          {
            echo "first<<$d"
            if [ "$FAST" = true ]; then render .github/prompts/site-request.md .github/prompts/fast.md
            else render .github/prompts/site-request.md; fi
            echo "$d"
            echo "retry<<$d"
            render .github/prompts/site-request.md .github/prompts/retry.md
            echo "$d"
          } >> "$GITHUB_OUTPUT"

      # 모델을 명시하지 않으면 Opus(1M 컨텍스트) 로 돌아 요청 하나에 $1~3 이
      # 든다. 턴 상한은 최악의 비용을 묶는 장치다. 모호한 요청일수록 끝없이
      # 다듬으려 드는데, 실제로 "더 예쁘게 뭔가 많이" 요청이 55턴 $2.79 를
      # 썼다. 정상 작업은 8~26턴이다. 먼저 시도하는 싼 모델은 더 짧게 끊는다 -
      # 오래 헤매는 것 자체가 넘겨야 한다는 신호다.
      - name: Claude 1차
        id: first
        uses: anthropics/claude-code-action@v1
        # 싼 모델이 실패해도 좋은 모델이 이어받으므로 작업을 멈추지 않는다.
        continue-on-error: ${{ steps.model.outputs.fast == 'true' }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          branch_prefix: "request/"
          claude_args: >-
            --model ${{ steps.model.outputs.first }}
            --max-turns ${{ steps.model.outputs.fast == 'true' && (vars.CLAUDE_FAST_MAX_TURNS || '25') || (vars.CLAUDE_MAX_TURNS || '40') }}
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*)"
          prompt: ${{ steps.prompt.outputs.first }}

      - name: 1차 결과 확인
        id: check
        if: steps.model.outputs.fast == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          TOOLS: ${{ runner.temp }}/tools
        run: |
          GITHUB_OUTPUT="$RUNNER_TEMP/first-pr" node "$TOOLS/find-pr.mjs"
          pr=$(sed -n 's/^pr=//p' "$RUNNER_TEMP/first-pr")

          if [ -n "$pr" ]; then
            git fetch -q origin main "pull/$pr/head:first-try"
            git worktree add -q "$RUNNER_TEMP/first" first-try
            if (cd "$RUNNER_TEMP/first" && BASE_REF=origin/main REPORT_FILE="$RUNNER_TEMP/first.md" node "$TOOLS/validate-site.mjs"); then
              echo "1차 PR #$pr 이 검사를 통과했습니다. 그대로 씁니다."
              echo "escalate=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # 검사에 걸린 PR 은 닫는다. 열어두면 2차의 PR 과 섞인다.
            gh pr close "$pr" --delete-branch \
              --comment "검사에 걸려 더 나은 모델로 다시 시도합니다." || true
          fi

          echo "1차가 검사를 통과한 PR 을 만들지 못했습니다. 2차로 넘깁니다."
          echo "escalate=true" >> "$GITHUB_OUTPUT"
          # 2차가 남긴 댓글만 요청자에게 보내도록 시점을 적어둔다.
          echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: 2차 준비 - 작업 트리 되돌리기
        if: steps.check.outputs.escalate == 'true'
        run: |
          git checkout -q -f -B main origin/main
          git clean -fdq

      - name: Claude 2차
        if: steps.check.outputs.escalate == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          branch_prefix: "request/"
          claude_args: >-
            --model ${{ steps.model.outputs.strong }}
            --max-turns ${{ vars.CLAUDE_MAX_TURNS || '40' }}
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*)"
          prompt: ${{ steps.prompt.outputs.retry }}

      - name: PR 찾기
        id: findpr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: node "$RUNNER_TEMP/tools/find-pr.mjs"

      - name: 머지 전 검사
        id: validate
        if: steps.findpr.outputs.pr != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: origin/main
          REPORT_FILE: ${{ runner.temp }}/report.md
        run: |
          git fetch origin "pull/${{ steps.findpr.outputs.pr }}/head:pr-branch"
          git checkout -f pr-branch
          node "$RUNNER_TEMP/tools/validate-site.mjs"

      - name: 검사 통과 - 자동 머지
        id: merge
        if: steps.findpr.outputs.pr != '' && steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.findpr.outputs.pr }}" --merge --delete-branch
          files=$(git diff --name-only origin/main...pr-branch | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "merged=true" >> "$GITHUB_OUTPUT"

          # PR 본문의 "Closes #N" 만으로는 닫히지 않는다. 봇이 만든 PR 은
          # 자동 연결 닫기가 동작하지 않아 처리된 이슈가 계속 열려 있고,
          # 무엇이 남았는지 구분할 수 없게 된다. 명시적으로 닫는다.
          gh issue close "${{ github.event.issue.number }}" \
            --comment "반영 완료. PR #${{ steps.findpr.outputs.pr }} 가 머지되어 배포되었습니다." \
            || echo "::warning::이슈 닫기 실패"

      - name: 검사 실패 - PR 을 열어둔 채 보고
        if: steps.findpr.outputs.pr != '' && steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 자동 머지하지 않았습니다"
            echo
            echo "머지 전 검사에서 걸렸습니다. 사람이 확인해주세요."
            echo
            cat "${{ runner.temp }}/report.md"
          } > "${{ runner.temp }}/comment.md"
          gh pr comment "${{ steps.findpr.outputs.pr }}" --body-file "${{ runner.temp }}/comment.md"

      # 검사에서 걸리면 PR 만 열린 채 남는다. 알리지 않으면 요청자는
      # 답을 영영 받지 못하고 관리자는 걸린 줄도 모른다.
      - name: 검사 실패 - 관리자에게 알림
        if: steps.findpr.outputs.pr != '' && steps.validate.outcome == 'failure'
        working-directory: ${{ runner.temp }}/tools
        env:
          MAIL_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ALERT_TO: ${{ vars.NOTIFY_CC || 'kakwak123@gmail.com' }}
          WORKFLOW_NAME: "수정 요청 처리 - 머지 전 검사에서 걸림 (PR 열려 있음)"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ steps.findpr.outputs.pr }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          npm install --no-audit --no-fund >/dev/null 2>&1 || true
          node send-alert.mjs || true

      # PR 이 없다 = 이미 반영된 요청이거나, 이해하지 못했거나, 만들지 못했다.
      # 여기서 아무것도 하지 않으면 요청자는 답을 영영 받지 못한다.
      - name: PR 없이 끝난 요청 - 요청자에게 메일
        if: steps.findpr.outputs.pr == ''
        working-directory: ${{ runner.temp }}/tools
        env:
          GH_TOKEN: ${{ github.token }}
          MAIL_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          REPLY_TO_EMAIL: ${{ secrets.ALLOWED_SENDERS }}
          NOTIFY_CC: ${{ vars.NOTIFY_CC || 'kakwak123@gmail.com' }}
          REQUEST_TITLE: ${{ github.event.issue.title }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          SINCE: ${{ steps.check.outputs.since }}
        run: |
          # 표시가 붙은 마지막 댓글을 쓰고, 없으면 마지막 댓글을 쓴다.
          # 표시를 빠뜨린 "이미 반영됨" 댓글이 기본 되묻기 문구로 나가
          # 요청자가 같은 요청을 거듭 보낸 일이 있었다 (#22).
          # 2차까지 갔으면 1차(싼 모델)의 댓글은 빼고 2차의 것만 본다.
          # ESCALATE 는 모델끼리의 신호라 요청자에게 보내지 않는다.
          c=$(gh issue view "$ISSUE" --repo "$REPO" --json comments \
                --jq '[.comments[] | select(.createdAt >= ($ENV.SINCE // "")) | .body | select(test("<!--ESCALATE-->") | not)]
                      | (map(select(test("<!--(ASK|DONE|NOTE)-->"))) | last) // last // ""')
          if grep -q '<!--DONE-->' <<<"$c"; then mode=done
          elif grep -q '<!--ASK-->' <<<"$c"; then mode=ask
          elif grep -q '<!--NOTE-->' <<<"$c"; then mode=note
          elif [ -n "$c" ]; then mode=note
          else mode=ask; echo "::warning::댓글이 없어 기본 문구로 보냅니다."
          fi
          q=$(sed 's/<!--\(ASK\|DONE\|NOTE\)-->//' <<<"$c" | sed '/^[[:space:]]*$/d')
          echo "메일 종류: $mode"
          npm install --no-audit --no-fund >/dev/null 2>&1 || true
          MODE="$mode" QUESTION="$q" node send-question.mjs || true

          # 이미 반영된 요청은 할 일이 끝났다. 열어두면 무엇이 남았는지 헷갈린다.
          if [ "$mode" = done ]; then
            gh issue close "$ISSUE" --repo "$REPO" --reason completed \
              --comment "이미 반영되어 있어 변경 없이 닫습니다." || true
          fi

      - name: 회신 메일 발송
        if: steps.merge.outputs.merged == 'true'
        working-directory: ${{ runner.temp }}/tools
        env:
          MAIL_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          REPLY_TO_EMAIL: ${{ secrets.ALLOWED_SENDERS }}
          NOTIFY_CC: ${{ vars.NOTIFY_CC || 'kakwak123@gmail.com' }}
          PR_TITLE: ${{ github.event.issue.title }}
          PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ steps.findpr.outputs.pr }}
          CHANGED_FILES: ${{ steps.merge.outputs.files }}
          AUTO_MERGED: "true"
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install --no-audit --no-fund
          # 요청자용 요약(<!--SUMMARY-->)이 PR 본문에 있다.
          PR_BODY=$(gh pr view "${{ steps.findpr.outputs.pr }}" --repo "${{ github.repository }}" --json body --jq .body || true) \
            node send-reply.mjs

      # 무인 운영에서는 침묵이 정상과 구분되지 않는다. 실패를 메일로 알린다.
      - name: 실패 시 관리자에게 알림
        if: failure()
        working-directory: ${{ runner.temp }}/tools
        env:
          MAIL_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ALERT_TO: ${{ vars.NOTIFY_CC || 'kakwak123@gmail.com' }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node -e "process.exit(0)" 2>/dev/null || exit 0
          npm install --no-audit --no-fund >/dev/null 2>&1 || true
          node send-alert.mjs || true
