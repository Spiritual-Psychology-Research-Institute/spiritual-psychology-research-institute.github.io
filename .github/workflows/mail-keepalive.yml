# 메일 확인을 15분마다 깨우는 하트비트.
#
# 왜 필요한가: GitHub 예약 실행(cron)이 이 저장소에서 전혀 동작하지 않는다.
# 구축 후 3시간 동안 한 번도 뜨지 않았고, 포크/비활성/승인대기 어느 것도
# 아니며 워크플로는 active 다. 예약에만 의존하면 자리를 비운 동안 메일이
# 잡히지 않아 자동화가 무의미해진다.
#
# repository_dispatch 는 즉시 확실하게 동작하므로, 이 잡이 그것을 주기적으로
# 호출한다. 실제 작업은 mail-inbox 가 하고 여기서는 깨우기만 한다 - 그래야
# 두 IMAP 세션이 겹치지 않는다.
#
# 이건 우회책이다. 더 깔끔한 해법은 docs/AUTOMATION.md 의 Apps Script 방식이며,
# 그쪽으로 옮기거나 cron 이 정상화되면 이 파일은 지워도 된다.
name: 메일 확인 하트비트

on:
  workflow_dispatch:
  repository_dispatch:
    types: [keepalive]
  # 잡이 끊겼을 때 스스로 되살아나는 보루. cron 이 언젠가 한 번이라도
  # 뜨면 여기서 다시 물린다.
  schedule:
    - cron: "13 * * * *"

concurrency:
  group: mail-keepalive
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    # GitHub 잡 상한은 6시간. 그 안에서 돌고 스스로 다음 회차를 띄운다.
    timeout-minutes: 330
    permissions: {}
    steps:
      - name: 설정 여부 확인
        id: guard
        env:
          TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::AUTOMATION_TOKEN 이 없어 하트비트를 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 15분마다 메일 확인 깨우기
        if: steps.guard.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # 21회 x 15분 = 약 5시간 15분. 잡 상한 안에서 여유를 둔다.
          for i in $(seq 1 21); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d '{"event_type":"check-mail"}' \
              "https://api.github.com/repos/$REPO/dispatches")
            echo "[$i/21] $(date -u +%H:%M) 메일 확인 요청 -> HTTP $code"
            # if 문으로 쓴다. [ ... ] && sleep 은 마지막 회차에서 조건이 거짓이
            # 되어 종료코드 1 을 내고, bash -e 가 그것을 스텝 실패로 처리한다.
            # 그러면 다음 회차를 띄우는 스텝이 실행되지 않아 자기 갱신이 끊긴다.
            if [ "$i" -lt 21 ]; then sleep 900; fi
          done

      - name: 다음 회차 이어가기
        if: steps.guard.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          curl -s -o /dev/null -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"event_type":"keepalive"}' \
            "https://api.github.com/repos/$REPO/dispatches"
          echo "다음 하트비트를 띄웠습니다."
